name: Update Recent Activity

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build activity block
        id: build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const events = await github.rest.activity.listPublicEventsForUser({
              username: owner,
              per_page: 30,
            });
            const lines = [];
            const seen = new Set();
            for (const e of events.data) {
              if (lines.length >= 6) break;
              const repo = e.repo.name;
              const date = new Date(e.created_at).toISOString().slice(0, 10);
              const dedupKey = `${repo}|${e.type}`;
              if (seen.has(dedupKey)) continue;
              let line = "";
              if (e.type === "PushEvent") {
                const commits = (e.payload.commits || []).length;
                line = `🚀 \`${repo}\` — pushed ${commits} commit${commits === 1 ? "" : "s"} (${date})`;
              } else if (e.type === "CreateEvent") {
                line = `🌱 \`${repo}\` — created ${e.payload.ref_type} ${e.payload.ref || ""} (${date})`;
              } else if (e.type === "ReleaseEvent") {
                line = `📦 \`${repo}\` — release published (${date})`;
              } else if (e.type === "PublicEvent") {
                line = `👀 \`${repo}\` — made public (${date})`;
              } else if (e.type === "WatchEvent") {
                line = `⭐ \`${repo}\` — starred (${date})`;
              } else if (e.type === "ForkEvent") {
                line = `🍴 \`${repo}\` — forked (${date})`;
              } else if (e.type === "PullRequestEvent") {
                line = `🔀 \`${repo}\` — pull request ${e.payload.action} (${date})`;
              } else {
                continue;
              }
              seen.add(dedupKey);
              lines.push(line);
            }
            if (lines.length === 0) {
              lines.push("_(No recent public activity — heads down shipping.)_");
            }
            const body = lines.map((l) => `- ${l}`).join("\n");
            const result = `#### ⚡ Recent GitHub Activity\n\n${body}`;
            
            core.setOutput("result", result);
            return result;           

      - name: Patch and commit
        run: |
          python - <<'EOF'
          import os
          block = os.environ.get("BLOCK", "").strip()
          
          # Clean up any surrounding quotes if passed accidentally
          if (block.startswith('"') and block.endswith('"')) or (block.startswith("'") and block.endswith("'")):
              block = block[1:-1].encode().decode('unicode_escape')

          formatted_block = f"\n<!-- START_ACTIVITY -->\n{block}\n<!-- END_ACTIVITY -->\n"

          with open("README.md", "r", encoding="utf-8") as f:
              txt = f.read()
          
          start = txt.find("<!-- START_ACTIVITY -->")
          end = txt.find("<!-- END_ACTIVITY -->")
          
          if start != -1 and end != -1:
              end += len("<!-- END_ACTIVITY -->")
              new = txt[:start] + formatted_block.strip() + txt[end:]
          else:
              new = txt + "\n" + formatted_block

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new)
          print("Successfully patched README.md")
          EOF
        env:
          BLOCK: ${{ steps.build.outputs.result }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet HEAD -- README.md || git commit -m "chore(profile): auto-update recent activity"
          git push
