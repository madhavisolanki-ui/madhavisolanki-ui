name: Automatic Bot Commit

on:
  # Roz subah 5:30 baje IST (UTC 00:00) par apne aap chalega
  schedule:
    - cron: '0 0 * * *'
  
  # Ise aap GitHub Actions tab se manual bhi run kar sakte hain
  workflow_dispatch:
  
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Modify a file
        run: |
          echo "Bot run on: $(date)" >> bot-log.txt

      - name: Commit and Push changes
        run: |
          git status
          git add bot-log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bot updated log file [skip ci]" && git push origin main)
