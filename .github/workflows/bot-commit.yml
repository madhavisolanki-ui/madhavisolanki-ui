name: Automatic Bot Commit

on:
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:
  
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update README invisibly
        run: |
          # Yahan HTML comment use kiya hai taaki text profile par show na ho
          echo "<!-- Last bot run: $(date) -->" >> README.md

      - name: Commit and Push changes
        run: |
          git status
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update profile README [skip ci]" && git push origin main)
