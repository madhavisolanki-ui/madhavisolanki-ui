name: Update GitHub Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GitHub Metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER="madhavisolanki-ui"

          REPOS=$(gh api "users/$USER" --jq '.public_repos')

          ISSUES=$(gh api "search/issues?q=is%3Aissue+is%3Aopen+user%3A$USER" \
            --jq '.total_count')

          PRS=$(gh api "search/issues?q=is%3Apr+is%3Aopen+author%3A$USER" \
            --jq '.total_count')

          STARS=$(gh api --paginate "users/$USER/repos?per_page=100" \
            --jq '.[].stargazers_count' | awk '{sum += $1} END {print sum+0}')

          cat > metrics.json <<EOF
          {
            "repositories": "$REPOS",
            "issues": "$ISSUES",
            "prs": "$PRS",
            "stars": "$STARS"
          }
          EOF

      - name: Commit Metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics.json

          git diff --cached --quiet || \
          git commit -m "chore: update GitHub metrics"

          git push
